<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Repair Ticket | Apex Tech Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --dark: #0f172a;
            --bg-gray: #f8fafc;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-gray);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--dark);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Open a Repair Ticket</h1>
            <p>Submit your device details for workshop drop-off, remote support, or postal collection.</p>
        </div>
        
        <!-- Uses a direct mailto link handler to route tickets straight to your email without errors -->
        <form id="ticketForm" onsubmit="submitTicket(event)">
            <div class="form-group">
                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" required placeholder="John Smith">
            </div>

            <div class="form-group">
                <label for="customerPhone">Phone / WhatsApp Number</label>
                <input type="tel" id="customerPhone" required placeholder="07724 631623">
            </div>

            <div class="form-group">
                <label for="deviceType">Device Make & Model</label>
                <input type="text" id="deviceType" required placeholder="e.g. Dell Inspiron / MacBook Air">
            </div>

            <div class="form-group">
                <label for="logistics">Service Delivery Method</label>
                <select id="logistics" required>
                    <option value="Royal Mail Tracked Collection">📦 Royal Mail Tracked Collection</option>
                    <option value="Remote IT Support (AnyDesk)">⚡ Remote IT Support (AnyDesk)</option>
                    <option value="Workshop Drop-Off (Potters Bar)">📍 Workshop Drop-Off (Potters Bar)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="issueDescription">Problem Description / Symptoms</label>
                <textarea id="issueDescription" required placeholder="Describe what's happening with your device..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Repair Ticket</button>
        </form>

        <a href="index.html" class="back-link">← Return to Home & Services</a>
    </div>

    <script>
        function submitTicket(event) {
            event.preventDefault();
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const device = document.getElementById('deviceType').value;
            const logistics = document.getElementById('logistics').value;
            const issue = document.getElementById('issueDescription').value;

            const subject = encodeURIComponent("New Repair Ticket from " + name);
            const body = encodeURIComponent(
                "Customer Name: " + name + "\n" +
                "Phone: " + phone + "\n" +
                "Device: " + device + "\n" +
                "Delivery Method: " + logistics + "\n\n" +
                "Issue Description:\n" + issue
            );

            window.location.href = `mailto:aderianwallaxaal@gmail.com?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
